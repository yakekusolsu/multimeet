services:
  multimeet:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://ome.tv}
      TOKEN_SECRET: ${TOKEN_SECRET:-change-this-secret-before-public-deployment}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-6}
    restart: unless-stopped
